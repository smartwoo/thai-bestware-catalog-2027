<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไทย เบสท์แวร์ e-Catalogue 2027</title>
<meta name="description" content="แคตตาล็อกออนไลน์ ภาชนะเมลามีน 100% ตราดอกไม้ – บริษัท ไทย เมลามีนแวร์ อินดัสเทรียล จำกัด">
<meta property="og:title" content="ไทย เบสท์แวร์ e-Catalogue 2027">
<meta property="og:description" content="ภาชนะเมลามีน 100% ตราดอกไม้ – เปิดอ่านแบบพลิกหน้า">
<meta property="og:image" content="pages/001.jpg">
<link rel="icon" href="thumbs/001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a1620;
    --bg2: #4a1f33;
    --accent: #e6197e;
    --ink: #fff;
    --muted: rgba(255,255,255,.65);
    --bar: rgba(20,10,15,.72);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Prompt", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg) 70%);
    overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  }
  header img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #fff; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; line-height: 1.2; }
  header small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  #stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 56px;
  }
  #rot { flex: 0 0 auto; position: relative; transition: transform .35s ease; }
  #book { margin: 0 auto; min-width: 0 !important; min-height: 0 !important; max-width: none !important; touch-action: none; }
  #book .stf__item { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  #book .page { background: #fff; }
  #book .page img { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, opacity .2s;
  }
  .nav:hover { background: var(--accent); }
  .nav:disabled { opacity: .25; pointer-events: none; }
  .nav svg { width: 22px; height: 22px; }
  #prev { left: 8px; } #next { right: 8px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  #loading .bar { width: 200px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .tb {
    height: 38px; min-width: 38px; padding: 0 10px; border-radius: 19px; border: 0;
    background: var(--bar); color: #fff; cursor: pointer; font: inherit; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tb:hover, .tb[aria-pressed="true"] { background: var(--accent); }
  .tb:disabled { opacity: .35; pointer-events: none; }
  .tb svg { width: 18px; height: 18px; }
  #counter { background: var(--bar); border-radius: 19px; height: 38px; display: inline-flex; align-items: center; padding: 0 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #counter input { width: 3.2em; background: transparent; border: 0; border-bottom: 1px solid var(--muted); color: #fff; font: inherit; text-align: center; padding: 0; }

  /* Page overview: zooms out from the current page to a grid, and back into the page you pick. */
  #overview { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; background: rgba(24,9,16,0); transition: background .4s ease; }
  #overview.show { background: rgba(24,9,16,.97); }
  .ov-head { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 6px; opacity: 0; transition: opacity .3s; }
  #overview.show .ov-head { opacity: 1; }
  .ov-head b { font-weight: 500; font-size: 15px; }
  #ovScroll { flex: 1; overflow: auto; touch-action: pan-y; padding: 10px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  #ovGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 22px 16px; max-width: 1180px; margin: 0 auto; transform-origin: 0 0; }
  #ovGrid.anim { transition: transform .45s cubic-bezier(.22,.7,.2,1); }
  #ovGrid button { border: 0; padding: 0; background: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px; transition: opacity .3s; }
  #ovGrid.focus button:not(.pick) { opacity: 0; }
  #ovGrid img { display: block; width: 100%; aspect-ratio: 612 / 792; object-fit: cover; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.45); outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .2s, transform .2s; }
  #ovGrid button:hover img { transform: translateY(-3px); }
  #ovGrid button { position: relative; }
  #ovGrid button.cur img { outline: 4px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 9px rgba(230,25,126,.25), 0 6px 18px rgba(0,0,0,.45); }
  #ovGrid button.cur { color: #fff; font-weight: 500; }
  #ovGrid button.cur::after {
    content: "กำลังดู"; position: absolute; top: 6px; left: 6px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  #ovGrid span { display: block; margin-top: 8px; text-align: center; }
  @media (max-width: 640px) { #ovGrid { grid-template-columns: repeat(3, 1fr); gap: 16px 10px; } }

  #zoom {
    position: fixed; inset: 0; z-index: 30; background: rgba(10,4,8,.96);
    overflow: auto; display: none; cursor: zoom-out; touch-action: pan-x pan-y pinch-zoom;
  }
  #zoom.open { display: block; }
  #zoom img { display: block; margin: 0 auto; width: min(1600px, 100%); height: auto; }
  #zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 31; }
  #hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; }
  @media (max-width: 640px) {
    #stage { padding: 4px 8px; }
    .nav { display: none; }
    header h1 { font-size: 14px; }
    .tb .lbl, #fsBtn, #first, #last { display: none; }
    footer { gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <img src="thumbs/001.jpg" alt="">
  <h1>ไทย เบสท์แวร์ e-Catalogue 2027<small>ภาชนะเมลามีน 100% · บริษัท ไทย เมลามีนแวร์ อินดัสเทรียล จำกัด</small></h1>
</header>

<main id="stage">
  <div id="loading"><div>กำลังโหลดแคตตาล็อก…<div class="bar"><i id="loadbar"></i></div></div></div>
  <div id="rot"></div>
  <button class="nav" id="prev" aria-label="หน้าก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="nav" id="next" aria-label="หน้าถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <div id="hint">ลากมุมกระดาษเพื่อพลิกหน้า · คลิกสองครั้งเพื่อซูม</div>
</main>

<footer>
  <button class="tb" id="first" title="หน้าแรก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
  <button class="tb" id="stepPrev" title="ย้อนกลับ 1 หน้า" aria-label="ย้อนกลับ 1 หน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="counter"><input id="pageInput" inputmode="numeric" aria-label="ไปที่หน้า">&nbsp;/&nbsp;<span id="total">–</span></span>
  <button class="tb" id="stepNext" title="ถัดไป 1 หน้า" aria-label="ถัดไป 1 หน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <button class="tb" id="last" title="หน้าสุดท้าย"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
  <button class="tb" id="thumbBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">ทุกหน้า</span></button>
  <button class="tb" id="modeBtn"></button>
  <button class="tb" id="rotBtn" title="หมุนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span class="lbl">หมุน</span></button>
  <button class="tb" id="zoomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="lbl">ซูม</span></button>
  <button class="tb" id="fsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span class="lbl">เต็มจอ</span></button>
  <button class="tb" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span class="lbl">แชร์</span></button>
</footer>

<div id="overview" hidden role="dialog" aria-label="ทุกหน้า">
  <div class="ov-head"><b>ทุกหน้า · เลือกหน้าที่ต้องการ</b><button class="tb" id="ovClose" aria-label="ปิด">✕</button></div>
  <div id="ovScroll"><div id="ovGrid"></div></div>
</div>
<div id="zoom"><button class="tb close" aria-label="ปิด">✕</button><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(async function () {
  const meta = await fetch('data/meta.json').then(r => r.json());
  const N = meta.numPages;
  const pad = i => String(i).padStart(3, '0');
  const src = i => 'pages/' + pad(i) + '.jpg';
  // Phones get 1000px-wide pages: decoding 1600px pages costs too much memory/GPU during the flip.
  const small = Math.min(screen.width, screen.height) * (devicePixelRatio || 1) <= 1300 || matchMedia('(max-width: 640px)').matches;
  const pageSrc = i => small ? 'pages-m/' + pad(i) + '.jpg' : src(i);
  const $ = id => document.getElementById(id);
  document.getElementById('total').textContent = N;

  const pw = meta.pages[0].w, ph = meta.pages[0].h, ratio = pw / ph;
  const stage = $('stage'), rot = $('rot'), pageInput = $('pageInput');
  const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } };
  let mode = store('fb-mode') === 'double' ? 'double' : 'single';   // chosen by the viewer, any screen shape
  let angle = 0;                                                    // 0 / 90 / 180 / 270, clockwise
  let book = null, pageFlip = null, imgs = [], state = 'read', pending = false;

  // Size the rotation box to one page or one spread; when turned 90/270 it fits the swapped stage.
  function fit() {
    const cs = getComputedStyle(stage);
    const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 18;
    const [bw, bh] = angle % 180 ? [availH, availW] : [availW, availH];
    const r = ratio * (mode === 'double' ? 2 : 1);
    const w = Math.floor(Math.min(bw, bh * r)), h = Math.floor(w / r);
    rot.style.width = w + 'px';
    rot.style.height = h + 'px';
    rot.style.transform = angle ? 'rotate(' + angle + 'deg)' : '';
    if (book) book.style.height = h + 'px';
  }

  // (Re)build the book. StPageFlip "stretch" shows one page when the block is narrower than
  // 2 × minWidth, so minWidth picks the mode (its CSS min-width is overridden in the stylesheet).
  function build(start) {
    if (pageFlip) pageFlip.destroy();
    book = document.createElement('div');
    book.id = 'book';
    rot.appendChild(book);
    const dbl = mode === 'double';
    for (let i = 1; i <= N; i++) {
      const d = document.createElement('div');
      d.className = 'page';
      if (dbl && (i === 1 || i === N)) d.dataset.density = 'hard';
      const img = new Image();
      img.alt = 'หน้า ' + i;
      img.draggable = false;
      img.decoding = 'async';
      img.src = pageSrc(i);
      d.appendChild(img);
      book.appendChild(d);
    }
    imgs = [...book.querySelectorAll('img')];
    fit();
    pageFlip = new St.PageFlip(book, {
      width: pw / 2, height: ph / 2,
      size: 'stretch',
      minWidth: dbl ? 50 : 5000, maxWidth: 5000, minHeight: 50, maxHeight: 8000,
      showCover: dbl,
      usePortrait: true,
      startPage: start,
      drawShadow: true,
      maxShadowOpacity: 0.3,
      mobileScrollSupport: false,
      showPageCorners: angle === 0,
      useMouseEvents: angle === 0,   // drag maths assume an unrotated book; rotated books use the swipe handler below
      flippingTime: 650,
      swipeDistance: 30
    });
    pageFlip.loadFromHTML(book.querySelectorAll('.page'));
    const ui = pageFlip.getUI();
    if (ui && ui.onResize) removeEventListener('resize', ui.onResize);  // the library's own unthrottled handler
    state = 'read';
    pageFlip.on('changeState', e => { state = e.data; if (state === 'read' && pending) relayout(); });
    pageFlip.on('flip', sync);
    book.addEventListener('dblclick', e => {
      const img = e.target.closest('.page')?.querySelector('img');
      openZoom(img ? imgs.indexOf(img) + 1 : pageFlip.getCurrentPageIndex() + 1);
    });
    sync();
  }

  // Re-layout only when the size really changes, never mid-flip. Mobile browsers fire resize
  // whenever the address bar slides in/out; relayouting then is what made the page jitter.
  let lastW = innerWidth, lastH = innerHeight, timer;
  function relayout() {
    if (state !== 'read') { pending = true; return; }
    pending = false; lastW = innerWidth; lastH = innerHeight;
    fit(); pageFlip.update();
  }
  addEventListener('resize', () => {
    const touch = matchMedia('(pointer: coarse)').matches;
    if (innerWidth === lastW && touch && Math.abs(innerHeight - lastH) < 160) return;
    clearTimeout(timer); timer = setTimeout(relayout, 150);
  });

  function sync() {
    if (!pageFlip) return;
    const idx = pageFlip.getCurrentPageIndex();
    let label = String(idx + 1), lastVisible = idx;
    if (pageFlip.getOrientation() === 'landscape' && idx > 0) {
      const l = idx % 2 === 1 ? idx : idx - 1;   // with a lone cover, spreads are (1,2), (3,4)…
      lastVisible = Math.min(N - 1, l + 1);
      label = lastVisible > l ? (l + 1) + '-' + (lastVisible + 1) : String(l + 1);
    }
    if (document.activeElement !== pageInput) pageInput.value = label;
    $('prev').disabled = $('stepPrev').disabled = $('first').disabled = idx === 0;
    $('next').disabled = $('stepNext').disabled = $('last').disabled = lastVisible >= N - 1;
    history.replaceState(null, '', '#page=' + (idx + 1));
  }

  // 1-page / 2-page toggle: the button shows the mode it switches to.
  const ICON_ONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1.5"/></svg>';
  const ICON_TWO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v15c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v15"/></svg>';
  function modeButton() {
    const toDouble = mode === 'single';
    $('modeBtn').innerHTML = (toDouble ? ICON_TWO : ICON_ONE) + '<span class="lbl">' + (toDouble ? 'ดู 2 หน้า' : 'ดู 1 หน้า') + '</span>';
    $('modeBtn').title = toDouble ? 'แสดงทีละ 2 หน้า' : 'แสดงทีละ 1 หน้า';
  }
  $('modeBtn').onclick = () => {
    mode = mode === 'single' ? 'double' : 'single';
    store('fb-mode', mode);
    modeButton();
    build(pageFlip.getCurrentPageIndex());
  };
  modeButton();

  // Rotate 90° clockwise per click (180° = upside down, e.g. showing a customer across the table).
  $('rotBtn').onclick = () => {
    angle = (angle + 90) % 360;
    zoom.querySelector('img').style.transform = angle === 180 ? 'rotate(180deg)' : '';
    build(pageFlip.getCurrentPageIndex());
  };
  // Swipe on a rotated book: map the screen swipe onto the book's own x axis.
  let sw = null;
  stage.addEventListener('pointerdown', e => { if (angle && !e.target.closest('button')) sw = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointerup', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, a = angle * Math.PI / 180;
    sw = null;
    const lx = dx * Math.cos(a) + dy * Math.sin(a), ly = -dx * Math.sin(a) + dy * Math.cos(a);
    if (Math.abs(lx) > 40 && Math.abs(lx) > Math.abs(ly)) lx < 0 ? pageFlip.flipNext() : pageFlip.flipPrev();
  });

  // Wait for the first few pages so the opening flip is smooth.
  let loaded = 0;
  await Promise.all([1, 2, 3, 4].map(i => {
    const im = new Image(); im.src = pageSrc(i);
    return im.decode().catch(() => {}).then(() => { $('loadbar').style.width = (++loaded / 4 * 100) + '%'; });
  }));
  const m = location.hash.match(/page=(\d+)/);
  build(m ? Math.min(N, Math.max(1, +m[1])) - 1 : 0);
  $('loading').remove();

  const go = n => { n = Math.max(1, Math.min(N, n | 0)); pageFlip.flip(n - 1); };
  $('prev').onclick = $('stepPrev').onclick = () => pageFlip.flipPrev();
  $('next').onclick = $('stepNext').onclick = () => pageFlip.flipNext();
  $('first').onclick = () => go(1);
  $('last').onclick = () => go(N);
  pageInput.addEventListener('focus', () => pageInput.select());
  pageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { go(parseInt(pageInput.value, 10)); pageInput.blur(); } });
  pageInput.addEventListener('blur', sync);

  // Page overview. Opening zooms out from the page on screen to the grid; picking a page zooms
  // the grid back in so the chosen thumbnail lands exactly where that page sits in the book.
  const ov = $('overview'), grid = $('ovGrid');
  for (let i = 1; i <= N; i++) {
    const b = document.createElement('button');
    b.innerHTML = '<img src="thumbs/' + pad(i) + '.jpg" alt="หน้า ' + i + '"><span>' + i + '</span>';
    b.onclick = () => closeOverview(i - 1);
    grid.appendChild(b);
  }
  let ovOpen = false, ovTimer;
  const zoomable = () => angle === 0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pageRect(idx) {
    const r = rot.getBoundingClientRect();
    if (pageFlip.getOrientation() !== 'landscape') return r;
    const right = idx % 2 === 0;   // lone cover and even indices sit on the right of the spread
    return { left: r.left + (right ? r.width / 2 : 0), top: r.top, width: r.width / 2 };
  }
  // Transform (origin: grid's top-left) that maps thumbnail idx onto the page's on-screen rect.
  function zoomTo(idx) {
    const t = pageRect(idx), g = grid.getBoundingClientRect();
    const b = grid.children[idx].querySelector('img').getBoundingClientRect();
    const s = t.width / b.width;
    return 'translate(' + (t.left - g.left - s * (b.left - g.left)) + 'px,' + (t.top - g.top - s * (b.top - g.top)) + 'px) scale(' + s + ')';
  }
  function openOverview() {
    if (ovOpen) return;
    ovOpen = true; clearTimeout(ovTimer);
    const idx = pageFlip.getCurrentPageIndex();
    // Frame every page currently on screen (both halves of a spread in 2-page mode).
    let shown = [idx];
    if (pageFlip.getOrientation() === 'landscape' && idx > 0) {
      const l = idx % 2 === 1 ? idx : idx - 1;
      shown = l + 1 < N ? [l, l + 1] : [l];
    }
    [...grid.children].forEach((b, i) => { b.classList.toggle('cur', shown.includes(i)); b.classList.toggle('pick', i === idx); });
    grid.classList.remove('anim');
    grid.style.transform = 'none';
    ov.hidden = false;
    grid.children[idx].scrollIntoView({ block: 'center' });
    if (zoomable()) { grid.classList.add('focus'); grid.style.transform = zoomTo(idx); }
    grid.offsetWidth;   // commit the zoomed-in start state before animating out
    requestAnimationFrame(() => {
      grid.classList.add('anim');
      grid.classList.remove('focus');
      grid.style.transform = 'none';
      ov.classList.add('show');
    });
    $('thumbBtn').setAttribute('aria-pressed', 'true');
  }
  function closeOverview(idx) {
    if (!ovOpen) return;
    ovOpen = false;
    if (idx != null && idx !== pageFlip.getCurrentPageIndex()) { pageFlip.turnToPage(idx); sync(); }
    idx = pageFlip.getCurrentPageIndex();
    [...grid.children].forEach((b, i) => b.classList.toggle('pick', i === idx));
    if (zoomable()) { grid.classList.add('focus'); grid.style.transform = zoomTo(idx); }
    ov.classList.remove('show');
    $('thumbBtn').setAttribute('aria-pressed', 'false');
    ovTimer = setTimeout(() => { ov.hidden = true; }, 460);
  }
  $('thumbBtn').onclick = openOverview;
  $('ovClose').onclick = () => closeOverview();

  // Pinch on touch screens: fingers together on the book → overview; fingers apart on the
  // overview → back into the page under the fingers (or the current page). Two-finger touches
  // are kept away from StPageFlip and from the browser's own page zoom.
  let pinch = null;
  const span = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  addEventListener('touchstart', e => {
    if (e.touches.length !== 2 || zoom.classList.contains('open')) return;
    e.stopPropagation();
    pinch = {
      d0: span(e.touches), done: false, fromBook: !ovOpen,
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  }, { capture: true, passive: true });
  addEventListener('touchmove', e => {
    if (!pinch) return;
    e.stopPropagation();
    if (e.cancelable) e.preventDefault();
    if (pinch.done || e.touches.length < 2) return;
    const r = span(e.touches) / pinch.d0;
    if (!ovOpen && r < 0.75) { pinch.done = true; openOverview(); }
    else if (ovOpen && r > 1.3) {
      pinch.done = true;
      const b = document.elementFromPoint(pinch.x, pinch.y)?.closest('#ovGrid button');
      closeOverview(b ? [...grid.children].indexOf(b) : undefined);
    }
  }, { capture: true, passive: false });
  addEventListener('touchend', e => {
    if (!pinch) return;
    e.stopPropagation();
    if (e.touches.length) return;
    // The first finger already reached StPageFlip before the second landed; rebuild so it
    // doesn't hold a half-started fold.
    if (pinch.fromBook) build(pageFlip.getCurrentPageIndex());
    pinch = null;
  }, { capture: true });

  // Zoom view (full-resolution single page, scrollable / pinch-zoomable)
  const zoom = $('zoom'), zimg = zoom.querySelector('img');
  function openZoom(n) { zimg.src = src(n); zoom.classList.add('open'); zoom.scrollTop = 0; }
  function closeZoom() { zoom.classList.remove('open'); }
  zoom.onclick = closeZoom;
  $('zoomBtn').onclick = () => openZoom(pageFlip.getCurrentPageIndex() + 1);

  // Fullscreen
  $('fsBtn').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  };

  // Share
  $('shareBtn').onclick = async () => {
    const url = location.href.split('#')[0];
    try {
      if (navigator.share) await navigator.share({ title: document.title, url });
      else { await navigator.clipboard.writeText(url); toast('คัดลอกลิงก์แล้ว'); }
    } catch (e) {}
  };
  function toast(t) {
    const h = $('hint'); h.textContent = t; h.style.opacity = 1;
    setTimeout(() => h.style.opacity = 0, 1800);
  }

  // Keyboard
  addEventListener('keydown', e => {
    if (e.target === pageInput) return;
    if (e.key === 'Escape') { closeZoom(); closeOverview(); }
    if (zoom.classList.contains('open') || ovOpen) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') pageFlip.flipNext();
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') pageFlip.flipPrev();
    if (e.key === 'Home') go(1);
    if (e.key === 'End') go(N);
  });

  sync();
  setTimeout(() => $('hint').style.opacity = 0, 4000);
})();
</script>
</body>
</html>
