<style>
  :root {
    --bg: #2a1620;
    --bg2: #4a1f33;
    --accent: #e6197e;
    --ink: #fff;
    --muted: rgba(255,255,255,.65);
    --bar: rgba(20,10,15,.72);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Prompt", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg) 70%);
    overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  }
  header img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #fff; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; line-height: 1.2; }
  header small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  #stage {
    flex: 1; min-height: 0; position: relative; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 56px;
  }
  #rot { flex: 0 0 auto; position: relative; transition: transform .35s ease; }
  /* Flip engine. Every moving part is a transform on its own layer: the fold is made of rotated
     overflow:hidden "half-plane" boxes and a mirrored flap, so the GPU composites each frame
     without repainting the page images (clip-path based flips repaint, which stuttered on phones). */
  .fb { position: relative; user-select: none; -webkit-user-select: none; touch-action: none; cursor: grab; }
  .fb .pg { position: absolute; top: 0; overflow: hidden; background: #fff; }
  .fb .pg img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; pointer-events: none; }
  .fb .st { box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .fb .spine { position: absolute; top: 0; width: 44px; height: 100%; pointer-events: none;
    background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.14) 48%, rgba(0,0,0,.2) 50%, rgba(0,0,0,.08) 52%, rgba(0,0,0,0)); }
  .fb .fl { position: absolute; top: 0; }
  .fb .fl .pg { left: 0; }
  .fb .clip { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; }
  .fb .inner { transform-origin: 0 0; }
  .fb .flapg { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .fb .flapg .pg { box-shadow: none; }
  .fb .back img { transform: scaleX(-1); }
  .fb .sh { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .fb .shu { background: linear-gradient(to right, rgba(0,0,0,.38), rgba(0,0,0,.12) 35%, rgba(0,0,0,0)); }
  .fb .shf { background: linear-gradient(to right, rgba(0,0,0,.22), rgba(255,255,255,.18) 25%, rgba(0,0,0,.04) 70%, rgba(0,0,0,0)); }
  .fb .shr { background: linear-gradient(to left, rgba(0,0,0,.16), rgba(0,0,0,0)); }
  .fb.flipping .clip, .fb.flipping .inner, .fb.flipping .flapg, .fb.flipping .sh { will-change: transform; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, opacity .2s;
  }
  .nav:hover { background: var(--accent); }
  .nav:disabled { opacity: .25; pointer-events: none; }
  .nav svg { width: 22px; height: 22px; }
  #prev { left: 8px; } #next { right: 8px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  #loading .bar { width: 200px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .tb {
    height: 38px; min-width: 38px; padding: 0 10px; border-radius: 19px; border: 0;
    background: var(--bar); color: #fff; cursor: pointer; font: inherit; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tb:hover, .tb[aria-pressed="true"] { background: var(--accent); }
  .tb:disabled { opacity: .35; pointer-events: none; }
  .tb svg { width: 18px; height: 18px; }
  #counter { background: var(--bar); border-radius: 19px; height: 38px; display: inline-flex; align-items: center; padding: 0 14px; font-variant-numeric: tabular-nums; font-size: 14px; }
  #counter input { width: 3.2em; background: transparent; border: 0; border-bottom: 1px solid var(--muted); color: #fff; font: inherit; text-align: center; padding: 0; }

  #dlMenu {
    position: fixed; z-index: 22; left: 50%; transform: translateX(-50%);
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    width: min(320px, calc(100vw - 32px)); padding: 6px;
    background: #2b1220; border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #dlMenu button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px;
    background: none; border: 0; border-radius: 9px; color: #fff; font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  #dlMenu button:hover, #dlMenu button:focus-visible { background: rgba(255,255,255,.08); outline: none; }
  #dlMenu button:disabled { opacity: .5; cursor: progress; }
  #dlMenu img { width: 30px; height: 39px; object-fit: cover; border-radius: 2px; flex: none; }
  #dlMenu .ico { width: 30px; height: 39px; display: grid; place-items: center; flex: none; background: #e6197e; border-radius: 3px; font-size: 10px; font-weight: 600; }
  #dlMenu small { display: block; color: var(--muted); font-size: 12px; }
  #dlMenu hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 4px 6px; }

  /* Page overview: zooms out from the current page to a grid, and back into the page you pick. */
  /* Everything that animates here is transform/opacity on its own layer, so the GPU composites it
     without repainting: the backdrop fades via opacity, the grid scales via transform. */
  #overview { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; }
  #overview::before { content: ""; position: absolute; inset: 0; background: rgb(24,9,16); opacity: 0; transition: opacity .4s ease; will-change: opacity; }
  #overview.show::before { opacity: .97; }
  .ov-head, #ovScroll { position: relative; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 6px; opacity: 0; transition: opacity .3s; }
  #overview.show .ov-head { opacity: 1; }
  .ov-head b { font-weight: 500; font-size: 15px; }
  #ovScroll { flex: 1; overflow: auto; touch-action: pan-y; padding: 10px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  #ovGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 22px 16px; max-width: 1180px; margin: 0 auto; transform-origin: 0 0; }
  #ovGrid.anim { transition: transform .45s cubic-bezier(.22,.7,.2,1); }
  #ovGrid.moving { will-change: transform; }
  #ovGrid.moving button { will-change: opacity; }
  #ovGrid.moving img { box-shadow: none !important; }
  #ovGrid button { border: 0; padding: 0; background: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px; transition: opacity .3s; }
  #ovGrid.focus button:not(.pick) { opacity: 0; }
  #ovGrid img { display: block; width: 100%; aspect-ratio: var(--page-ratio, 612 / 792); object-fit: cover; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.45); outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .2s, transform .2s; }
  #ovGrid button:hover img { transform: translateY(-3px); }
  #ovGrid button { position: relative; }
  #ovGrid button.cur img { outline: 4px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 9px rgba(230,25,126,.25), 0 6px 18px rgba(0,0,0,.45); }
  #ovGrid button.cur { color: #fff; font-weight: 500; }
  #ovGrid button.cur::after {
    content: "กำลังดู"; position: absolute; top: 6px; left: 6px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  #ovGrid span { display: block; margin-top: 8px; text-align: center; }
  @media (max-width: 640px) { #ovGrid { grid-template-columns: repeat(3, 1fr); gap: 16px 10px; } }

  #zoom {
    position: fixed; inset: 0; z-index: 30; background: rgba(10,4,8,.96);
    overflow: auto; display: none; cursor: zoom-out; touch-action: pan-x pan-y pinch-zoom;
  }
  #zoom.open { display: block; }
  #zoom img { display: block; margin: 0 auto; width: min(1600px, 100%); height: auto; }
  #zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 31; }
  #hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; }
  @media (max-width: 640px) {
    #stage { padding: 4px 8px; }
    .nav { display: none; }
    header h1 { font-size: 14px; }
    .tb .lbl, #fsBtn, #first, #last { display: none; }
    footer { gap: 4px; }
  }
</style>

<body>
<header>
  <img src="thumbs/001.jpg" alt="">
  <h1>ไทย เบสท์แวร์ e-Catalogue 2027<small>ภาชนะเมลามีน 100% · บริษัท ไทย เมลามีนแวร์ อินดัสเทรียล จำกัด</small></h1>
</header>

<main id="stage">
  <div id="loading"><div>กำลังโหลดแคตตาล็อก…<div class="bar"><i id="loadbar"></i></div></div></div>

  <button class="nav" id="prev" aria-label="หน้าก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

  <button class="tb" id="modeBtn"></button>

  <button class="tb" id="zoomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="lbl">ซูม</span></button>
  <button class="tb" id="fsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span class="lbl">เต็มจอ</span></button>
  <button class="tb" id="dlBtn" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">ดาวน์โหลด</span></button>
  <button class="tb" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span class="lbl">แชร์</span></button>
</footer>

<div id="overview" hidden role="dialog" aria-label="ทุกหน้า">
  <div class="ov-head"><b>ทุกหน้า · เลือกหน้าที่ต้องการ</b><button class="tb" id="ovClose" aria-label="ปิด">✕</button></div>
  <div id="ovScroll"><div id="ovGrid"></div></div>
</div>
<div id="dlMenu" role="menu" hidden></div>
<div id="zoom"><button class="tb close" aria-label="ปิด">✕</button><img alt=""></div>

<script>
/*
 * Flipbook: a page-curl engine that animates with transforms only.
 *
 * Geometry (in "flip area" coordinates: origin at the top-left of the turning page, W × H):
 * the grabbed corner C is dragged to point P. The fold line is the perpendicular bisector of
 * C→P (through midpoint M, normal n pointing at C). The page is cut along that line: the part
 * on the spine side stays (front), the part on the corner side is mirrored across the line and
 * becomes the flap showing the page's back. Both cuts are rotated overflow:hidden boxes, so a
 * frame only updates transform matrices — no repaint.
 *
 * Single mode: one page; turning forward shows the next page underneath and on the flap.
 * Double mode: spreads [–,0], [1,2], [3,4]…; the right page turns over onto the left.
 */
function Flipbook(host, o) {
  const N = o.count, dbl = !!o.double;
  const el = document.createElement('div');
  el.className = 'fb';
  host.appendChild(el);
  const div = (cls, parent) => { const d = document.createElement('div'); d.className = cls; (parent || el).appendChild(d); return d; };
  const img = parent => { const i = new Image(); i.draggable = false; i.alt = ''; parent.appendChild(i); return i; };

  const sL = div('pg st'), sR = div('pg st');
  const sLi = img(sL), sRi = img(sR);
  const spine = dbl ? div('spine') : null;
  const fl = div('fl'); fl.hidden = true;
  const under = div('pg', fl), underI = img(under), shU = div('sh shu', under);
  const fClip = div('clip', fl), fIn = div('pg inner', fClip), fI = img(fIn), shR = div('sh shr', fIn);
  const flapG = div('flapg', fl), bClip = div('clip', flapG), bIn = div('pg inner back', bClip), bI = img(bIn), shF = div('sh shf', bIn);

  let W = 1, H = 1, S = 4, x0 = 0;
  let idx = clampIdx(o.start | 0);
  let job = null;            // current flip: { dir, y0, base, target, ... }
  let raf = 0, anim = null, handlers = {};
  const emit = (ev, v) => (handlers[ev] || []).forEach(f => f(v));

  function clampIdx(i) { i = Math.max(0, Math.min(N - 1, i)); return dbl ? (i === 0 ? 0 : (i % 2 ? i : i - 1)) : i; }
  const spreadOf = i => dbl ? (i === 0 ? 0 : Math.ceil(i / 2)) : i;
  const leftOf = s => (dbl && s > 0 && 2 * s - 1 < N) ? 2 * s - 1 : null;
  const rightOf = s => dbl ? (2 * s < N ? 2 * s : null) : (s < N ? s : null);
  const idxOfSpread = s => dbl ? (s === 0 ? 0 : 2 * s - 1) : s;
  const lastSpread = dbl ? spreadOf(N - 1) : N - 1;

  function setImg(im, i) {
    if (i == null) { im.parentNode.style.visibility = 'hidden'; return; }
    im.parentNode.style.visibility = '';
    const s = o.src(i);
    if (im.getAttribute('src') !== s) im.src = s;
  }
  function decoded(i) {
    if (i == null) return Promise.resolve();
    const t = new Image(); t.src = o.src(i);
    return Promise.race([t.decode().catch(() => {}), new Promise(r => setTimeout(r, 150))]);
  }
  // Keep neighbours decoded so a drag can start instantly.
  const warm = [];
  function prefetch() {
    const s = spreadOf(idx);
    warm.length = 0;
    for (let k = -2; k <= 2; k++) {
      const t = s + k;
      if (t < 0 || t > lastSpread) continue;
      [leftOf(t), rightOf(t)].forEach(i => { if (i != null) { const im = new Image(); im.src = o.src(i); im.decode().catch(() => {}); warm.push(im); } });
    }
  }

  function showStatic() {
    const s = spreadOf(idx);
    if (dbl) { setImg(sLi, leftOf(s)); setImg(sRi, rightOf(s)); }
    else { sL.style.visibility = 'hidden'; setImg(sRi, s); }
    sR.style.visibility = (dbl ? rightOf(s) : s) == null ? 'hidden' : '';
  }

  function resize(w, h) {
    W = dbl ? w / 2 : w; H = h; S = 3 * (W + H); x0 = dbl ? W : 0;
    el.style.width = w + 'px'; el.style.height = h + 'px';
    for (const p of [sL, sR, under, fIn, bIn]) { p.style.width = W + 'px'; p.style.height = H + 'px'; }
    sL.style.left = '0px'; sR.style.left = x0 + 'px';
    if (spine) spine.style.left = (W - 22) + 'px';
    fl.style.left = x0 + 'px'; fl.style.width = W + 'px'; fl.style.height = H + 'px';
    for (const c of [fClip, bClip]) { c.style.width = S + 'px'; c.style.height = S + 'px'; }
    for (const sh of [shU, shF, shR]) { sh.style.width = (W * 0.22) + 'px'; sh.style.height = S + 'px'; }
    if (job) render(job.P);
  }

  // Which pages take part in a turn from the current spread to spread t.
  function plan(dir, t) {
    const s = spreadOf(idx);
    if (dir === 'next') {
      if (t <= s || t > lastSpread) return null;
      return dbl ? { front: rightOf(s), back: leftOf(t), under: rightOf(t), left: leftOf(s), t }
                 : { front: s, back: t, under: t, left: null, t };
    }
    if (t >= s || t < 0) return null;
    return dbl ? { front: rightOf(t), back: leftOf(s), under: rightOf(s), left: leftOf(t), t }
               : { front: t, back: s, under: s, left: null, t };
  }

  function begin(dir, y0, t) {
    const p = plan(dir, t);
    if (!p) return false;
    setImg(fI, p.front); setImg(bI, p.back); setImg(underI, p.under);
    if (dbl) setImg(sLi, p.left);
    fIn.style.visibility = bIn.style.visibility = '';
    if (p.front == null) fIn.style.visibility = 'hidden';
    if (p.back == null) bIn.style.visibility = 'hidden';
    sR.style.visibility = 'hidden';
    fl.hidden = false;
    el.classList.add('flipping');
    job = Object.assign(p, { dir, y0, C: { x: W, y: y0 }, P: null });
    render(dir === 'next' ? { x: W, y: y0 } : { x: -W, y: y0 });
    return true;
  }

  // Keep the paper attached at the spine (it can't stretch).
  function constrain(P) {
    const y0 = job.y0, A = { x: 0, y: y0 }, B = { x: 0, y: H - y0 }, D = Math.hypot(W, H);
    let dx = P.x - A.x, dy = P.y - A.y, d = Math.hypot(dx, dy);
    if (d > W) { P = { x: A.x + dx * W / d, y: A.y + dy * W / d }; }
    dx = P.x - B.x; dy = P.y - B.y; d = Math.hypot(dx, dy);
    if (d > D) { P = { x: B.x + dx * D / d, y: B.y + dy * D / d }; }
    return P;
  }

  const T = (x, y) => 'translate(' + x + 'px,' + y + 'px)';
  function render(P) {
    P = constrain(P);
    job.P = P;

      const name = site.filePrefix + '-page-' + pad(i + 1) + '.png';
      const file = new File([blob], name, { type: 'image/png' });
      // On phones the share sheet offers "Save Image" straight to Photos.
      if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      saveBlob(blob, name);
    } catch (e) { toast('ดาวน์โหลดไม่สำเร็จ ลองอีกครั้ง'); }
    finally { btn.disabled = false; closeDl(); }
  }
  function openDl() {
    dlMenu.innerHTML = '';
    for (const i of visiblePages()) {
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = '<img src="thumbs/' + pad(i + 1) + '.jpg" alt=""><span>บันทึกหน้า ' + (i + 1) + ' เป็นรูป PNG<small>ความละเอียด ' + pw + ' × ' + ph + ' px</small></span>';
      b.onclick = () => downloadPng(i, b);
      dlMenu.appendChild(b);
    }
    dlMenu.appendChild(document.createElement('hr'));
    const p = document.createElement('button');
    p.setAttribute('role', 'menuitem');
    p.innerHTML = '<span class="ico">PDF</span><span>ดาวน์โหลดทั้งเล่ม (PDF)<small>' + N + ' หน้า · ประมาณ ' + site.pdfSize + '</small></span>';
    p.onclick = () => {
      const a = document.createElement('a');
      a.href = PDF_URL; a.download = PDF_URL.split('/').pop();   // cross-origin links download via the server's headers
      document.body.appendChild(a); a.click(); a.remove(); closeDl();
    };
    dlMenu.appendChild(p);
    dlMenu.hidden = false;
    dlBtn.setAttribute('aria-expanded', 'true');
  }
  function closeDl() { dlMenu.hidden = true; dlBtn.setAttribute('aria-expanded', 'false'); }
  dlBtn.onclick = e => { e.stopPropagation(); dlMenu.hidden ? openDl() : closeDl(); };
  document.addEventListener('pointerdown', e => { if (!dlMenu.hidden && !dlMenu.contains(e.target) && !dlBtn.contains(e.target)) closeDl(); });

  function toast(t) {
    const h = $('hint'); h.textContent = t; h.style.opacity = 1;
    setTimeout(() => h.style.opacity = 0, 1800);
  }

  // Keyboard
  addEventListener('keydown', e => {
    if (e.target === pageInput) return;
    if (e.key === 'Escape') { closeZoom(); closeOverview(); }
    if (zoom.classList.contains('open') || ovOpen) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') pageFlip.flipNext();
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') pageFlip.flipPrev();
    if (e.key === 'Home') go(1);
    if (e.key === 'End') go(N);
  });

  sync();
  setTimeout(() => $('hint').style.opacity = 0, 4000);
})();
</script>
</body>
</html>
